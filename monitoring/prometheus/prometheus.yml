# Prometheus scrapes the model API's /metrics endpoint (request count, latency, errors).
# Metric names come from api/main.py: api_requests_total{endpoint,status},
# api_request_latency_seconds{endpoint} (histogram) and model_predictions_total{outcome}.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: model-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
