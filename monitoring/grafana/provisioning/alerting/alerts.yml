# Grafana alert rules, provisioned as code.
# They appear under Alerting -> Alert rules -> folder "MLOps".
apiVersion: 1

groups:
  - orgId: 1
    name: model-monitoring
    folder: MLOps
    interval: 30s
    rules:
      - uid: data-drift-alert
        title: Data drift detected
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          # $$ escapes Grafana env-var interpolation in provisioning files
          summary: "Evidently reports drift in {{ $$values.B }} share of feature columns (threshold 0.3)."
          description: "The monitor also triggers the Prefect 'training-pipeline/retrain' deployment when this happens."
          __dashboardUid__: mlops-overview
        labels:
          severity: warning
          team: mlops
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: postgres
            model:
              refId: A
              rawQuery: true
              editorMode: code
              format: table
              rawSql: "SELECT drift_share AS value FROM drift_metrics ORDER BY created_at DESC LIMIT 1"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.3]}

      - uid: api-error-rate-alert
        title: High API error rate
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "More than 10% of model API requests are failing."
          __dashboardUid__: mlops-overview
        labels:
          severity: critical
          team: mlops
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: "sum(rate(api_errors_total[2m])) / clamp_min(sum(rate(api_requests_total[2m])), 1e-9)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.1]}

      - uid: api-latency-alert
        title: High p95 latency
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "p95 latency of /predict is above 1 second."
          __dashboardUid__: mlops-overview
        labels:
          severity: warning
          team: mlops
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.95, sum by (le) (rate(api_request_latency_seconds_bucket{endpoint="/predict"}[2m])))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [1]}
