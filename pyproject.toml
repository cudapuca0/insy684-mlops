[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-core"
version = "0.1.0"
description = "Shared code for the INSY 684 MLOps project"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5,<1.7",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "services"]
markers = [
    "integration: needs the API container running (set API_URL)",
]

[tool.ruff.lint.isort]
known-first-party = ["mlops_core", "flow", "api", "frontend"]
