name: CI

# Runs on every pull request (and on main after merge).
# In GitHub: Settings -> Branches -> protect `main` -> require status checks
# "lint", "unit-tests" and "integration-test" to pass before merging.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.8.1
      - name: Ruff lint
        run: ruff check .
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest tests/unit -v

  integration-test:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Export a model for the API container
        run: python scripts/export_model.py artifacts/model
      - name: Build the API image
        run: docker build -f services/api/Dockerfile -t api-under-test .
      - name: Start the API container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e MODEL_PATH=/model -e PREDICTION_LOGGING=false \
            -v "$PWD/artifacts/model:/model:ro" api-under-test
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
      - name: Integration test
        env:
          API_URL: http://localhost:8000
        run: pytest tests/integration -v
      - name: API logs (on failure)
        if: failure()
        run: docker logs api
