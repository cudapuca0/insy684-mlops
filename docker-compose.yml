# Full stack:  docker compose up -d --build
# Tear down:   docker compose down          (add -v to also delete data volumes)
# Traffic:     docker compose run --rm simulator --requests 500 [--drift]

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres
  MONITORING_DB: monitoring

x-py-healthcheck: &py-healthcheck
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow:
    build:
      context: .
      dockerfile: services/mlflow/Dockerfile
    image: ${IMAGE_PREFIX:-mlops}/mlflow:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mlflow_artifacts:/mlartifacts
    ports:
      - "5050:5000"   # host 5050 (macOS uses 5000 for AirPlay)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]

  prefect:
    image: prefecthq/prefect:3.1.4-python3.11
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    volumes:
      - prefect_data:/root/.prefect
    ports:
      - "4200:4200"
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]

  training:
    build:
      context: .
      dockerfile: services/training/Dockerfile
    image: ${IMAGE_PREFIX:-mlops}/training:latest
    environment:
      <<: *db-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREFECT_API_URL: http://prefect:4200/api
      SHARED_DIR: /shared
    volumes:
      - shared_data:/shared
    depends_on:
      mlflow:
        condition: service_healthy
      prefect:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: ${IMAGE_PREFIX:-mlops}/api:latest
    environment:
      <<: *db-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_RELOAD_SECONDS: "30"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    image: ${IMAGE_PREFIX:-mlops}/frontend:latest
    environment:
      API_URL: http://api:8000
    ports:
      - "5001:5001"
    depends_on:
      - api
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: services/monitor/Dockerfile
    image: ${IMAGE_PREFIX:-mlops}/monitor:latest
    environment:
      <<: *db-env
      SHARED_DIR: /shared
      PREFECT_API_URL: http://prefect:4200/api
      MONITOR_INTERVAL_SECONDS: "30"
      RETRAIN_ON_DRIFT: "true"
    volumes:
      - shared_data:/shared
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    image: ${IMAGE_PREFIX:-mlops}/simulator:latest
    profiles: ["simulator"]   # only runs via `docker compose run simulator ...`
    environment:
      API_URL: http://api:8000
      SHARED_DIR: /shared
    volumes:
      - shared_data:/shared
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - postgres

volumes:
  postgres_data:
  mlflow_artifacts:
  prefect_data:
  shared_data:
  grafana_data:
